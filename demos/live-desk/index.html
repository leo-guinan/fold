<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Night Desk — fold live demo</title>
<style>
  * { box-sizing: border-box } body { margin:0; background:#07090c; color:#c8d0d8; font:14px/1.45 system-ui, sans-serif }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 32px }
  canvas { width:100%; aspect-ratio:16/9; display:block; background:#000 }
  .bar { display:flex; gap:12px; align-items:center; margin-top:10px; color:#6c7783; font: 12px ui-monospace, monospace }
  button { font:inherit; padding:6px 14px; border-radius:6px; border:1px solid #2a323c; background:transparent; color:#c8d0d8; cursor:pointer }
  body.export main { max-width:none; padding:0; margin:0 } body.export canvas { width:1280px; height:720px } body.export .bar { display:none }
</style></head>
<body><main>
  <canvas></canvas>
  <div class="bar"><button id="sound">Sound on</button><span id="status">connecting…</span></div>
</main><script type="module" src="dist/app.js"></script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Week — Future Radio on fold</title>
<style>
  * { box-sizing: border-box } body { margin:0; background:#e4d9c3; color:#1f1b16; font:14px/1.45 Georgia, serif }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 32px }
  canvas { width:100%; aspect-ratio:16/9; display:block; background:#efe6d3; box-shadow: 0 1px 0 #cdbf9f, 0 12px 30px rgba(60,40,10,.18) }
  .bar { display:flex; gap:12px; align-items:center; margin-top:12px; color:#5f5648; font: 12px ui-monospace, monospace } .bar input { flex:1 }
  button { font:inherit; padding:6px 14px; border-radius:4px; border:1px solid #1f1b16; background:transparent; color:#1f1b16; cursor:pointer }
  body.export { background:#efe6d3 } body.export main { max-width:none; padding:0; margin:0 } body.export canvas { width:1280px; height:720px; box-shadow:none } body.export .bar { display:none }
</style></head>
<body><main>
  <canvas></canvas>
  <div class="bar"><button id="sound">Sound on</button><input id="scrub" type="range" min="0" step="0.01" value="0" hidden><span id="status">connecting…</span></div>
</main><script type="module" src="dist/app.js"></script></body></html>
